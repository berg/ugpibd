name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          # Linux builds run on 22.04, not ubuntu-latest: the glibc a binary is
          # linked against becomes its floor, and 24.04's 2.39 would refuse to
          # run on Ubuntu 22.04 or Debian 12. 22.04's 2.35 covers both, plus
          # everything newer.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          TAG=${GITHUB_REF_NAME}
          ARCHIVE="ugpibd-${TAG}-${{ matrix.target }}.tar.gz"
          tar czf "${ARCHIVE}" -C target/${{ matrix.target }}/release ugpibd ugpibd-scpi
          echo "ARCHIVE=${ARCHIVE}" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v5
        with:
          name: ugpibd-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  deb:
    name: Debian package (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same 22.04 glibc reasoning as the build job above; here it also sets
          # the libc6 version in the package's Depends.
          - os: ubuntu-22.04
            arch: amd64
          - os: ubuntu-22.04-arm
            arch: arm64

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: deb-${{ matrix.arch }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Build package
        run: |
          # cargo-deb prints the path it wrote; keep its conventional
          # name_version-revision_arch.deb filename for the release asset.
          DEB=$(cargo deb)
          # Absolute, so `apt-get install` cannot mistake it for a package name.
          echo "DEB=$(realpath "${DEB}")" >> "$GITHUB_ENV"
          ls -l "${DEB}"

      - name: Lint package
        run: |
          sudo apt-get update
          sudo apt-get install -y lintian
          # Informational: the tags worth acting on are errors. Warnings include
          # things a GitHub-release deb legitimately does not carry, such as a
          # Debian changelog.
          lintian --fail-on error --no-tag-display-limit "${DEB}"

      - name: Install, exercise, purge
        run: |
          set -x
          sudo apt-get install -y "${DEB}"

          # Files landed where the package says they did.
          test -x /usr/bin/ugpibd
          test -x /usr/bin/ugpibd-scpi
          test -f /usr/lib/udev/rules.d/60-ugpibd.rules
          test -f /etc/default/ugpibd
          test -f /usr/share/man/man1/ugpibd.1.gz
          test -f /usr/share/man/man1/ugpibd-scpi.1.gz

          # Binaries actually run on this glibc.
          ugpibd --help >/dev/null
          ugpibd-scpi --help >/dev/null
          ugpibd --backend list

          # postinst created the service account before udev was reloaded.
          getent passwd ugpibd
          getent group ugpibd

          # Units are installed and parse, but startup is opt-in: nothing should
          # be enabled or running after a plain install.
          systemctl cat ugpibd.service >/dev/null
          systemctl cat ugpibd-hotplug.service >/dev/null
          test "$(systemctl is-enabled ugpibd.service || true)" != "enabled"
          test "$(systemctl is-active ugpibd.service || true)" != "active"

          # The autostart gate must skip cleanly rather than fail when
          # UGPIBD_AUTOSTART is unset: ExecCondition= returning nonzero leaves
          # the unit inactive, not failed. Checked per-unit rather than via
          # `systemctl --failed`, which would also see unrelated runner services.
          sudo systemctl start ugpibd-hotplug.service
          test "$(systemctl is-active ugpibd.service || true)" != "active"
          for unit in ugpibd.service ugpibd-hotplug.service; do
            test "$(systemctl is-failed "$unit" || true)" != "failed"
          done

          sudo apt-get purge -y ugpibd
          test ! -e /usr/bin/ugpibd
          test ! -e /etc/default/ugpibd
          ! getent passwd ugpibd

      - uses: actions/upload-artifact@v5
        with:
          name: ugpibd-deb-${{ matrix.arch }}
          path: ${{ env.DEB }}

  deb-blacklist:
    name: Debian package (blacklist, all)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build package
        run: ./scripts/build-blacklist-deb .

      - name: Lint and inspect package
        run: |
          sudo apt-get update
          sudo apt-get install -y lintian
          lintian --fail-on error --no-tag-display-limit ./*_all.deb
          dpkg-deb -c ./*_all.deb
          # Guard against a builder umask leaking into the shipped directory
          # modes: 0775 on /usr, or 0700 on the staging root, would be applied
          # to the real directories on install.
          if dpkg-deb -c ./*_all.deb | grep -vE '^(drwxr-xr-x|-rw-r--r--)'; then
            echo "unexpected permissions in blacklist package" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: ugpibd-deb-blacklist
          path: ./*_all.deb

  release:
    name: Publish release
    needs: [build, deb, deb-blacklist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
          path: artifacts/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.deb
          generate_release_notes: true

  update-tap:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    if: ${{ vars.UPDATE_HOMEBREW_TAP == 'true' }}
    steps:
      - uses: actions/checkout@v5

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${GITHUB_REF_NAME}" \
            --pattern "*.tar.gz" \
            --dir artifacts/

      - name: Compute SHA256s and render formula
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          TAG=${GITHUB_REF_NAME}

          SHA_X86_MACOS=$(sha256sum "artifacts/ugpibd-${TAG}-x86_64-apple-darwin.tar.gz"       | cut -d' ' -f1)
          SHA_ARM_MACOS=$(sha256sum "artifacts/ugpibd-${TAG}-aarch64-apple-darwin.tar.gz"      | cut -d' ' -f1)
          SHA_X86_LINUX=$(sha256sum "artifacts/ugpibd-${TAG}-x86_64-unknown-linux-gnu.tar.gz"  | cut -d' ' -f1)
          SHA_ARM_LINUX=$(sha256sum "artifacts/ugpibd-${TAG}-aarch64-unknown-linux-gnu.tar.gz" | cut -d' ' -f1)

          sed \
            -e "s/__VERSION__/${VERSION}/g" \
            -e "s/__SHA256_X86_MACOS__/${SHA_X86_MACOS}/g" \
            -e "s/__SHA256_ARM_MACOS__/${SHA_ARM_MACOS}/g" \
            -e "s/__SHA256_X86_LINUX__/${SHA_X86_LINUX}/g" \
            -e "s/__SHA256_ARM_LINUX__/${SHA_ARM_LINUX}/g" \
            Formula/ugpibd.rb > rendered_formula.rb

      - name: Push to tap repo
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/berg/homebrew-ugpibd.git" tap
          mkdir -p tap/Formula
          cp rendered_formula.rb tap/Formula/ugpibd.rb
          cd tap
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add Formula/ugpibd.rb
          git commit -m "ugpibd ${VERSION}"
          git push
