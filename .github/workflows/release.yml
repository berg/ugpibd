name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          # Linux builds run on 22.04, not ubuntu-latest: the glibc a binary is
          # linked against becomes its floor, and 24.04's 2.39 would refuse to
          # run on Ubuntu 22.04 or Debian 12. 22.04's 2.35 covers both, plus
          # everything newer.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          TAG=${GITHUB_REF_NAME}
          ARCHIVE="ugpibd-${TAG}-${{ matrix.target }}.tar.gz"
          tar czf "${ARCHIVE}" -C target/${{ matrix.target }}/release ugpibd ugpibd-scpi
          echo "ARCHIVE=${ARCHIVE}" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v7
        with:
          name: ugpibd-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  deb:
    name: Debian package
    # Same steps the PR check runs (see ci.yml), so a packaging break cannot
    # first surface at tag time. Real versions here, not snapshots.
    uses: ./.github/workflows/deb.yml
    with:
      snapshot: false
      targets: >-
        [{"os": "ubuntu-22.04", "arch": "amd64"},
         {"os": "ubuntu-22.04-arm", "arch": "arm64"}]

  release:
    name: Publish release
    needs: [build, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: artifacts/

      # The release notes are the CHANGELOG entry for this tag, not a list of
      # merged pull requests: a reader deciding whether to upgrade wants to know
      # what changed for them, which no amount of commit titles adds up to.
      # scripts/release refuses to tag a version with no entry, so this cannot
      # silently fall back to an empty body.
      - name: Extract the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## v${version} " '
            index($0, v) == 1 { inside = 1; next }
            inside && /^## v/ { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no entry for ${GITHUB_REF_NAME}"
            exit 1
          fi
          cat release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.deb
          body_path: release-notes.md
          # Appended below the notes above, so the pull request list is still
          # there for anyone who wants it.
          generate_release_notes: true

  # The apt repository is published by apt.yml, which triggers on this workflow
  # completing rather than being called from it. See the comment there: a
  # workflow_call would run at the tag ref, and the github-pages environment only
  # allows deployments from main.

  update-tap:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    if: ${{ vars.UPDATE_HOMEBREW_TAP == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${GITHUB_REF_NAME}" \
            --pattern "*.tar.gz" \
            --dir artifacts/

      - name: Compute SHA256s and render formula
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          TAG=${GITHUB_REF_NAME}

          SHA_X86_MACOS=$(sha256sum "artifacts/ugpibd-${TAG}-x86_64-apple-darwin.tar.gz"       | cut -d' ' -f1)
          SHA_ARM_MACOS=$(sha256sum "artifacts/ugpibd-${TAG}-aarch64-apple-darwin.tar.gz"      | cut -d' ' -f1)
          SHA_X86_LINUX=$(sha256sum "artifacts/ugpibd-${TAG}-x86_64-unknown-linux-gnu.tar.gz"  | cut -d' ' -f1)
          SHA_ARM_LINUX=$(sha256sum "artifacts/ugpibd-${TAG}-aarch64-unknown-linux-gnu.tar.gz" | cut -d' ' -f1)

          sed \
            -e "s/__VERSION__/${VERSION}/g" \
            -e "s/__SHA256_X86_MACOS__/${SHA_X86_MACOS}/g" \
            -e "s/__SHA256_ARM_MACOS__/${SHA_ARM_MACOS}/g" \
            -e "s/__SHA256_X86_LINUX__/${SHA_X86_LINUX}/g" \
            -e "s/__SHA256_ARM_LINUX__/${SHA_ARM_LINUX}/g" \
            -e "/^# This file is a template/,/^# The rendered version lives/d" \
            Formula/ugpibd.rb > rendered_formula.rb

          # A leftover placeholder would push a formula that cannot resolve, and
          # the tap has no CI of its own to catch it.
          if grep -q '__[A-Z0-9_]*__' rendered_formula.rb; then
            echo "::error::Unrendered placeholders remain in the formula:"
            grep -n '__[A-Z0-9_]*__' rendered_formula.rb
            exit 1
          fi

      - name: Push to tap repo
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/berg/homebrew-ugpibd.git" tap
          mkdir -p tap/Formula
          cp rendered_formula.rb tap/Formula/ugpibd.rb
          cd tap
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add Formula/ugpibd.rb
          git commit -m "ugpibd ${VERSION}"
          git push
