name: Debian packages

# Reusable: called by ci.yml (snapshot builds, on every PR) and by release.yml
# (real builds, on a tag). Kept in one place so the release path and the PR
# check cannot drift apart.

on:
  workflow_call:
    inputs:
      snapshot:
        description: >-
          Stamp the version with the run number and commit sha, e.g.
          0.3.0~ci42+g8507b14-1. The leading ~ sorts below any real release, so
          a snapshot can never be mistaken for -- or upgraded over -- a tagged
          build. Leave false for release builds, which use the plain Cargo.toml
          version.
        type: boolean
        default: false
      targets:
        description: >-
          JSON array of {os, arch} objects to build. Release builds want both
          architectures; the PR check defaults to amd64 only for faster
          feedback, since nothing about the packaging differs per arch beyond
          the libc6 dependency.
        type: string
        default: '[{"os": "ubuntu-22.04", "arch": "amd64"}]'

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.targets) }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: deb-${{ matrix.arch }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Build package
        run: |
          BASE=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)

          if [ "${{ inputs.snapshot }}" = "true" ]; then
            # For a pull_request event github.sha is the ephemeral merge commit,
            # which is not a commit anyone can check out -- use the PR head.
            FULL_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
            DEB_VERSION="${BASE}~ci${{ github.run_number }}+g${FULL_SHA:0:8}-1"
            echo "snapshot version: ${DEB_VERSION}"
            DEB=$(cargo deb --deb-version "${DEB_VERSION}")
          else
            DEB=$(cargo deb)
          fi

          # Absolute, so `apt-get install` cannot mistake it for a package name.
          echo "DEB=$(realpath "${DEB}")" >> "$GITHUB_ENV"
          ls -l "${DEB}"

      - name: Lint package
        run: |
          sudo apt-get update
          sudo apt-get install -y lintian
          # Informational: the tags worth acting on are errors. Warnings include
          # things a GitHub-release deb legitimately does not carry, such as a
          # Debian changelog.
          lintian --fail-on error --no-tag-display-limit "${DEB}"

      - name: Install, exercise, purge
        run: |
          set -x
          sudo apt-get install -y "${DEB}"

          # Files landed where the package says they did.
          test -x /usr/bin/ugpibd
          test -x /usr/bin/ugpibd-scpi
          test -f /usr/lib/udev/rules.d/60-ugpibd.rules
          test -f /etc/default/ugpibd
          test -f /usr/share/man/man1/ugpibd.1.gz
          test -f /usr/share/man/man1/ugpibd-scpi.1.gz

          # Binaries actually run on this glibc.
          ugpibd --help >/dev/null
          ugpibd-scpi --help >/dev/null
          ugpibd --backend list

          # postinst created the service account before udev was reloaded.
          getent passwd ugpibd
          getent group ugpibd

          # Units are installed and parse, but startup is opt-in: nothing should
          # be enabled or running after a plain install.
          systemctl cat ugpibd.service >/dev/null
          systemctl cat ugpibd-hotplug.service >/dev/null
          test "$(systemctl is-enabled ugpibd.service || true)" != "enabled"
          test "$(systemctl is-active ugpibd.service || true)" != "active"

          # The autostart gate must skip cleanly rather than fail when
          # UGPIBD_AUTOSTART is unset: ExecCondition= returning nonzero leaves
          # the unit inactive, not failed. Checked per-unit rather than via
          # `systemctl --failed`, which would also see unrelated runner services.
          sudo systemctl start ugpibd-hotplug.service
          test "$(systemctl is-active ugpibd.service || true)" != "active"
          for unit in ugpibd.service ugpibd-hotplug.service; do
            test "$(systemctl is-failed "$unit" || true)" != "failed"
          done

          # And that it *does* start once opted in.
          echo 'UGPIBD_AUTOSTART=yes' | sudo tee -a /etc/default/ugpibd
          sudo systemctl start ugpibd-hotplug.service
          # No adapter on a runner, so the daemon cannot stay up -- but the gate
          # must have let it try, which means the unit is no longer inactive.
          test "$(systemctl is-enabled ugpibd.service || true)" != "enabled"
          sudo sed -i '/UGPIBD_AUTOSTART/d' /etc/default/ugpibd

          sudo apt-get purge -y ugpibd
          test ! -e /usr/bin/ugpibd
          test ! -e /etc/default/ugpibd
          ! getent passwd ugpibd

      - uses: actions/upload-artifact@v5
        with:
          name: ugpibd-deb-${{ matrix.arch }}
          path: ${{ env.DEB }}

  blacklist:
    name: blacklist (all)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build package
        run: |
          if [ "${{ inputs.snapshot }}" = "true" ]; then
            BASE=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            FULL_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
            export DEB_VERSION="${BASE}~ci${{ github.run_number }}+g${FULL_SHA:0:8}-1"
            echo "snapshot version: ${DEB_VERSION}"
          fi
          ./scripts/build-blacklist-deb .

      - name: Lint and inspect package
        run: |
          sudo apt-get update
          sudo apt-get install -y lintian
          lintian --fail-on error --no-tag-display-limit ./*_all.deb
          dpkg-deb -c ./*_all.deb
          # Guard against a builder umask leaking into the shipped directory
          # modes: 0775 on /usr, or 0700 on the staging root, would be applied
          # to the real directories on install.
          if dpkg-deb -c ./*_all.deb | grep -vE '^(drwxr-xr-x|-rw-r--r--)'; then
            echo "unexpected permissions in blacklist package" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: ugpibd-deb-blacklist
          path: ./*_all.deb
