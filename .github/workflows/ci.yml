name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Nothing in CI writes to the repository or the API.
permissions:
  contents: read

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - run: cargo test

  deb:
    name: Debian package
    # Builds and install-tests the packages on every PR, so maintainer-script
    # and packaging breakage surfaces here rather than at tag time. Versions are
    # stamped as snapshots (0.3.0~ci42+gdeadbeef-1) so a CI artifact can never be
    # confused with -- or upgraded over -- a real release.
    #
    # Both architectures, matching release.yml. arm64 is an explicitly supported
    # platform (64-bit Raspberry Pi OS), so it gets built and install-tested on a
    # real arm64 runner here rather than first being exercised at tag time.
    uses: ./.github/workflows/deb.yml
    with:
      snapshot: true
      targets: >-
        [{"os": "ubuntu-22.04", "arch": "amd64"},
         {"os": "ubuntu-22.04-arm", "arch": "arm64"}]
