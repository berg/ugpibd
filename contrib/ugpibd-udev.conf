# Configuration for ugpibd's udev rules, read by IMPORT{file} in
# /usr/lib/udev/rules.d/60-ugpibd.rules. Plain KEY=value lines only: udev
# parses this itself, so no quoting, no shell syntax, no line continuations.
#
# Separate from /etc/default/ugpibd because that file is sourced as a shell
# environment file by the service and contains quoted values; this one is
# parsed by udev.

# Let ugpibd claim USB Test & Measurement Class instruments -- a scope, DMM or
# generator's own USB port, or a GPIB bridge that presents as a USB488 device.
#
# Disabled by default -- uncomment to enable. USB-GPIB *adapters* (NI,
# Agilent, Keithley, MCC) are matched by their vendor ids and need no flag:
# they exist to be GPIB controllers. USBTMC devices are different. They are
# matched by interface class, which is every instrument on the machine, and
# they may already be driven by the kernel usbtmc driver, by pyvisa-py, or by
# vendor software -- so ugpibd does not take group ownership of them unless
# you say so here.
#
# With this set, every USBTMC instrument attached to this machine gets
# MODE=0660 GROUP=ugpibd and console-user access, and (with UGPIBD_AUTOSTART
# in /etc/default/ugpibd) can trigger the hotplug unit. To claim only specific
# instruments instead, leave this unset and write your own rule matching them
# by idVendor/idProduct in /etc/udev/rules.d/.
#
# Takes effect on the next plug event; for devices already attached, run
#   sudo udevadm control --reload-rules
#   sudo udevadm trigger --subsystem-match=usb --action=add
#UGPIBD_CLAIM_USBTMC=yes
