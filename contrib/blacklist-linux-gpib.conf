# Prevent the kernel GPIB drivers from claiming adapters that ugpibd drives.
#
# Installed by the optional ugpibd-blacklist-linux-gpib package as
# /etc/modprobe.d/ugpibd-blacklist-linux-gpib.conf.
#
# ugpibd talks to these adapters from userspace via usbfs. The in-kernel GPIB
# drivers (drivers/gpib, mainline since Linux 6.13, and the out-of-tree
# linux-gpib build that predates it) claim the same USB interfaces, which shows
# up as "failed to claim interface 0".
#
# Only the drivers for adapters ugpibd actually supports are listed. Module
# names verified against drivers/gpib/*/Makefile; both drivers' USB device
# tables confirm they bind exactly these adapters.
#
# `blacklist` stops kmod resolving the USB alias, which is what udev uses to
# autoload a driver when the device appears -- the failure mode this file
# exists to prevent. A deliberate `modprobe agilent_82357a` still works, so
# switching back to linux-gpib does not require removing this package.
#
# Caveat: blacklisting ni_usb_gpib also disables the kernel driver for the NI
# GPIB-USB-B, which ugpibd does NOT support. Module granularity is coarser than
# device granularity, so there is no way to exempt it. If you drive a USB-B
# with linux-gpib on this machine, do not install this package.

blacklist agilent_82357a
blacklist ni_usb_gpib
